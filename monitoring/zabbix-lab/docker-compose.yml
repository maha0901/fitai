# Минимальный стенд Zabbix 6.4 + MySQL для практики (лаборатория).
# Веб: http://localhost:8090  (логин по умолчанию: Admin / zabbix)
#
# Запуск из этой папки:
#   docker compose up -d
# Первый старт: подождать 2–5 минут, пока сервер создаст схему БД.

services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
      MYSQL_ROOT_PASSWORD: zabbix_root
    volumes:
      - zabbix_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pzabbix_root"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-6.4-latest
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
      MYSQL_DATABASE: zabbix
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: zabbix_root
    ports:
      - "10051:10051"
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-6.4-latest
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
      MYSQL_DATABASE: zabbix
    ports:
      # 8090 снаружи, чтобы не пересечься с другими сервисами проекта
      - "8090:8080"
    restart: unless-stopped

  # Агент с именем как у стандартного хоста «Zabbix server» (иначе UI ждёт агент на 127.0.0.1 внутри контейнера сервера).
  # В UI: Hosts → Zabbix server → Interfaces → Agent: Connect to = DNS, DNS name = zabbix-agent, port 10050
  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-6.4-latest
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    restart: unless-stopped

volumes:
  zabbix_mysql_data:
