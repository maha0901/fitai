# Одна явная сеть — чтобы Prometheus стабильно резолвил backend / node-exporter / cadvisor
# (на Docker Desktop иногда default-сеть ведёт себя непредсказуемо).
networks:
  fitai_net:
    driver: bridge

services:
  postgres:
    networks:
      - fitai_net
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fit_ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    networks:
      - fitai_net
    build: ./backend
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fit_ai_db
      JWT_SECRET: fit-ai-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node scripts/wait-and-migrate.js && node src/index.js"

  frontend:
    networks:
      - fitai_net
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  # Метрики хоста (CPU, RAM, диск — внутри Linux VM Docker Desktop)
  node-exporter:
    networks:
      - fitai_net
    image: prom/node-exporter:v1.7.0
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    restart: unless-stopped

  # Метрики контейнеров (CPU/RAM по каждому контейнеру)
  cadvisor:
    networks:
      - fitai_net
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  prometheus:
    networks:
      - fitai_net
    # Скрейп через хост — запасной путь, если имён сервисов из контейнера не хватает (Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: prom/prometheus:v2.48.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 9090 часто занят отдельным Prometheus на ПК — снаружи 9091
    ports:
      - "9091:9090"
    depends_on:
      - backend
      - node-exporter
      - cadvisor

  grafana:
    networks:
      - fitai_net
    image: grafana/grafana:10.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # Порт 3000 на Windows часто занят (Vite, другой Grafana) — снаружи 3001
      GF_SERVER_ROOT_URL: http://localhost:3001
      # Включаем сервис рендеринга для скриншотов панелей (используется и алертами, и нашим Telegram-ботом)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Отдельный сервис для рендеринга графиков в PNG (нужен, чтобы Telegram мог отправлять скрины)
  renderer:
    networks:
      - fitai_net
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped

  telegram-bot:
    networks:
      - fitai_net
    image: node:20-alpine
    working_dir: /bot
    volumes:
      - ./monitoring/telegram-bot:/bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASS: admin
      DASHBOARD_UID: fit-ai-server
      DASHBOARD_SLUG: fit-ai-server
    depends_on:
      - grafana
    command: sh -c "npm install --omit=dev && node index.js"

  # CI/CD (минимальная интеграция для учебного проекта)
  jenkins:
    networks:
      - fitai_net
    image: jenkins/jenkins:lts-jdk17
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8085:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  jenkins_home:
